# Generated by `gallery export` from the private gallery: do not edit by hand.
[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools" ]

[project]
name = "gallery"
version = "0.1.0"
description = "Studies of magnetron discharges and the codes behind them, from the SPOKES3D project: verification of the codes, method demonstrations and examples."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gallery-tools @ git+https://github.com/spokes3d/gallery-template@devel",
  "astropy",
  "byob",
  "matplotlib",
  "mpifield",
  "mpiparticles",
  "numpy",
  "plasma-plots",
  "plasmacoll",
  "scipy",
  "simgeometry",
  "wellbalanced",
]
optional-dependencies.docs = [
  "ipykernel",
  "kaleido",
  "plasma-plots[web]",
]
optional-dependencies.test = [ "pytest" ]

[tool.setuptools]
py-modules = [  ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra"

[tool.uv.sources]
byob = { git = "https://github.com/max-models/byob", branch = "devel" }
mpifield = { git = "https://github.com/max-models/mpifield", branch = "devel" }
mpiparticles = { git = "https://github.com/max-models/mpiparticles", branch = "devel" }
plasma-plots = { git = "https://github.com/max-models/plasma-plots", branch = "devel" }
plasmacoll = { git = "https://github.com/max-models/plasmacoll", branch = "devel" }
simgeometry = { git = "https://github.com/max-models/simgeometry", branch = "devel" }
wellbalanced = { git = "https://github.com/max-models/wellbalanced", branch = "devel" }
