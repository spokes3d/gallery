# Read by gallery-tools without running the script (see the Adding a study guide).
category: Basics
kind: example
public: true
codes:
- plasmacoll
- plasma-plots
ladder: outside the ladder (basics)
questions: []
summary: >-
  The length, time and transport scales of DC and HiPIMS magnetron plasmas in argon against
  density, field, pressure and electron temperature.
docs_preset: full
runtime: under a second
status: >-
  Textbook estimates, not a model or a verification; the two cases (0.5 Pa, 30 mT, 3 eV, 10^16 and
  10^19 m^-3) and the geometry are assumed. The electron-argon cross section is a constant 1e-19
  m^2 (plasmacoll has no electron set), so the electron collision quantities are good to a factor
  of about two.
figures:
- >-
  Length scales against the density at 30 mT, 0.5 Pa and 3 eV: the Debye length (T_e = 1, 3 and 10
  eV), electron and ion gyroradii, mean free paths in the gas, and the assumed gap and racetrack
  width.
- >-
  Frequencies against the density at 30 mT, 0.5 Pa and 3 eV: plasma, gyro- and collision
  frequencies, including the electron-ion Coulomb collisions.
- >-
  Frequencies against the magnetic field at 3 eV: gyrofrequencies, collision frequencies with the
  gas at 0.1, 0.5 and 5 Pa, and the electron plasma frequency at 10^15 and 10^19 m^-3.
- >-
  Electron Hall parameter over the magnetic field and the argon pressure at 3 eV, without Coulomb
  collisions; the dot is the typical DC case.
- >-
  Electron cross-field diffusion coefficient against the magnetic field at 3 eV: Bohm's T_e/(16 e
  B) and the classical value at 0.1, 0.5 and 5 Pa.
