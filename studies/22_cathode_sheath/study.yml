# Read by gallery-tools without running the script (see the Adding a study guide).
category: Basics
kind: example
public: true
codes: [byob, plasmacoll]
ladder: outside the ladder (basics)
questions: []
summary: >-
  Textbook estimates of the cathode sheath of a DC magnetron: its thickness, the energy of the
  ions at the target, and Thornton's minimum voltage.
docs_preset: full
runtime: a few seconds
status: >-
  Textbook estimates, not a model of a discharge and not compared with measurements; byob's
  Child–Langmuir width equals the closed form to rounding. Assumed: a planar 1D sheath with a
  given voltage and current, cross sections at one energy (50 eV), and no ionisation, fast
  neutrals or magnetic field in the sheath; γ, W₀ and the efficiencies are parameters.
figures:
- >-
  Sheath thickness against the sheath voltage for ion current densities of 10, 100 and 1000 A/m²:
  the collisionless Child–Langmuir law (solid) and the sheath at 100 Pa of argon (dashed).
- >-
  Lengths against the argon pressure at 400 V and 100 A/m²: the collisionless and collisional
  sheath thicknesses, the thinner one used, and the total and charge exchange mean free paths of
  Ar+.
- >-
  Energy distribution at the target of the ions that charge-exchanged in the sheath, at 400 V and
  100 A/m² for 0.5, 2, 5 and 20 Pa; the legend gives the fraction arriving with the full 400 eV
  (not drawn).
- >-
  Mean ion energy at the target (top) and fraction of ions crossing without charge exchange
  (bottom) against the argon pressure at 400 V, for 10, 100 and 1000 A/m²; the small step is the
  switch to the collisional sheath.
- >-
  Thornton's minimum voltage against the secondary electron yield γ for W₀/(ε_i ε_e) = 30, 60, 120
  and 240 eV, with the 300 and 600 V bounds of DC magnetrons (grey).
