# Read by gallery-tools without running the script (see the Adding a study guide).
category: Test particles
kind: example
public: true
codes:
- byob
- mpifield
- mpiparticles
- plasmacoll
ladder: outside the ladder (test particles in a prescribed spoke)
questions:
- Q7
summary: >-
  Test argon ions born in a made-up rotating three-spoke background: their energy at the target
  and where they land relative to the spokes.
docs_preset: quick
runtime: about 10 seconds (quick); seconds (smoke)
status: >-
  A demonstration, not a model and not a verification: a made-up background without back-reaction
  or cathode sheath, births from the background's ionization rate rather than the test electrons',
  and no sputtered metal ions. Qualitatively, the ions are too slow to follow the spokes, so the
  flux to the target peaks behind each spoke; the most energetic ions are born high up inside a
  spoke.
figures:
- >-
  Energy distribution of the ions at the cathode sheath edge (the target) and of the few lost to
  the substrate or the outer edge, per eV and relative to all ions born (log scale).
- >-
  Against the angle at the racetrack in the spoke frame: the ion flux to the target and the birth
  rate (relative to their means) with the potential at R0, and below the mean energy at the target
  and the share above 30 eV.
- >-
  Share of the ions born in each cell of the spoke frame that reach the target above 30 eV, with
  the -10, 0 and 6 V contours of the potential; below, the same share against the height of birth.
- >-
  One period in the lab frame (press Play, or drag the slider): the plasma potential, the rotating
  spokes and 500 test ions coloured by kinetic energy.
