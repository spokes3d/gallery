# Read by gallery-tools without running the script (see the Adding a study guide).
category: Test particles
kind: example
public: true
codes:
- byob
- mpifield
- picnic
- plasmacoll
ladder: outside the ladder (test particles in a prescribed spoke)
questions:
- Q6
- Q7
summary: >-
  Test electrons pushed through a made-up rotating three-spoke background with argon collisions:
  where they cross the field and ionize.
docs_preset: quick
runtime: about 3 minutes (quick); seconds (smoke)
status: >-
  A demonstration, not a model and not a verification. The background is made up and not self-
  consistent (no Poisson equation, the electrons do not act back on it), and the cross sections
  are rough stand-ins. Qualitatively, the cross-field flux to the anode is concentrated at the
  leading edge of each spoke and the ionization is enhanced behind it.
figures:
- >-
  One period of the rotating spokes in the lab frame (press Play, or drag the slider): the plasma
  potential and 1350 test electrons coloured by kinetic energy.
- >-
  Four followed electrons over 0.8 µs in the spoke frame, over the potential, with the trails of
  their last 100 ns.
- >-
  Ionization events around the first two of four instants of the period, in the lab frame, with
  the 0 V and 6 V contours of the potential.
- >-
  The same for the last two instants, on the same colour scale.
- >-
  The paths of the same four electrons over the whole 0.8 µs in the spoke frame, over the
  potential (a dot marks the start).
- >-
  Ionization rate averaged over the period in the spoke frame, with the 0 V and 6 V contours of
  the potential.
- >-
  Electron density averaged over the period, with the same contours.
- >-
  Mean electron energy averaged over the period, with the same contours.
- >-
  Cross-field electron flux to the anode averaged over the period, with the same contours.
- >-
  Azimuthal profiles at the racetrack in the spoke frame, averaged over the period and normalized:
  potential, mean electron energy, ionization rate and cross-field flux. The spokes move towards
  negative angles.
- >-
  Total ionization rate and cross-field current against time (relative to their means), and the
  potential a fixed probe at (R0, 0) sees.
