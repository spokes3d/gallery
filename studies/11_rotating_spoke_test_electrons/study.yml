# Read by gallery-tools without running the script (see the Adding a study guide).
category: Test particles
kind: example
public: true
codes:
- byob
- mpifield
- mpiparticles
- plasmacoll
ladder: outside the ladder (test particles in a prescribed spoke)
questions:
- Q6
- Q7
summary: >-
  Test electrons, Boris-pushed through a made-up rotating three-spoke background with argon collisions:
  where they cross the field and ionize.
docs_preset: quick
runtime: about 3 minutes (quick); seconds (smoke)
status: >-
  A demonstration, not a model and not a verification. The background is prescribed and made up (shape,
  amplitudes and speed chosen by hand), the electrons do not act back on it and the cross sections
  are rough stand-ins. With 10 000 markers the azimuthal profiles are averaged over a whole period
  and are smooth; the time signals are still noisy. What it shows qualitatively: the cross-field flux
  to the anode is concentrated at the leading edge of each spoke, and the ionization is enhanced behind
  it.
figures:
- >-
  The rotating spokes over one period of the pattern in the lab frame (press Play, or drag the
  slider): the plasma potential, three spokes on the racetrack moving clockwise at 10 km/s, and
  600 of the test electrons coloured by kinetic energy. The pattern turns by a third of a turn
  per period, so the last frame looks like the first one.
- >-
  The ionization events of the test electrons around four instants of the period, in the lab
  frame, with the 0 V and 6 V contours of the potential: the ionization zones turn with the
  spokes.
- >-
  The ionization events of the whole period in the spoke frame, with the potential contours: the ionization
  zone of each spoke.
- >-
  Azimuthal profiles at the racetrack in the spoke frame, averaged over the period and normalized:
  the potential, the mean electron energy, the ionization rate and the cross-field electron flux to
  the anode. The spokes move towards negative angles.
- >-
  Global signals against time: the total ionization rate and the cross-field current (relative to
  their means), and the potential a probe fixed at (R0, 0) sees.
