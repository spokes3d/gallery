# Read by gallery-tools without running the script (see the Adding a study guide).
category: Synthetic diagnostics
kind: example
public: true
codes:
- byob
- plasmacoll
ladder: outside the ladder (a synthetic probe in a prescribed spoke)
questions:
- Q6
summary: >-
  A synthetic Langmuir probe at fixed points as made-up rotating spokes pass: floating potential,
  saturation currents and swept I-V fits, against the true plasma, for sweeps shorter and longer
  than the passage of a spoke's leading edge.
docs_preset: quick
runtime: seconds
status: >-
  A synthetic diagnostic on a made-up background, not a model and not a verification. The background
  (the three-spoke pattern of the rotating-spoke test-electron study) is prescribed, and the probe does
  not perturb it. The probe follows byob's sheath (Bohm ion flux, Boltzmann-reduced random electron flux,
  floating sheath drop), continued by the standard collisionless thin-sheath electron branch up to the
  plasma potential: no sheath expansion (a flat ion saturation), no magnetized-electron effects on the
  electron current (the electron Larmor radius is a third of the probe radius, so a real electron
  saturation current would be lower and its knee rounder), no collisions in the sheath, no secondary
  emission, no RF or circuit effects. The fits use the same model the currents come from, so the errors
  of the short sweeps are the noise and a 1-2 % bias of the ion temperature left out of the Bohm speed;
  what the study shows is the error from the plasma changing during a sweep.
figures:
- >-
  A probe at a fixed bias at three points (3 mm inside the racetrack, on it, 1.5 mm outside it) over two
  periods of the pattern. First panel: the true plasma potential (solid) and the floating potential
  (dashed): the floating potential falls as a spoke arrives, since the hotter electrons charge the tip
  more negatively, so it moves against the plasma potential. Second and third panels: the electron
  temperature and density at the probe. Last panel: the ion saturation current (solid) and the
  electron saturation current at the plasma potential (dashed, unmagnetized: an upper bound).
- >-
  Sweeps of the bias on the racetrack centred between the spokes, on a leading edge and inside a spoke
  (top to bottom), 0.1 times (blue) and 10 times (red) as long as the edge takes to pass: the probe
  current, with the true plasma potential (dashed).
- >-
  The same sweeps: the electron current (the ion line removed) on a log scale with the two fitted lines,
  the fitted plasma potential at their knee (dotted) and the true one (dashed). The short sweeps give the
  true temperature and plasma potential; the long ones see the plasma change while the bias goes up,
  and their characteristics bend and break.
- >-
  The fitted density, electron temperature and plasma potential on the racetrack against time, each
  sweep a step over the time it takes, for sweeps 0.1, 1 and 10 times the passage time of the leading
  edge (0.26 µs), against the background at the probe (black). Sweeps of the passage time resolve the
  hump but smear the edge; sweeps ten times longer give values that depend on where the spoke is during
  the sweep and miss the shape of the hump.
