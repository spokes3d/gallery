# Read by gallery-tools without running the script (see the Adding a study guide).
category: Synthetic diagnostics
kind: example
public: true
codes:
- byob
- plasmacoll
ladder: outside the ladder (a synthetic probe in a prescribed spoke)
questions:
- Q6
summary: >-
  A synthetic Langmuir probe in made-up rotating spokes: floating potential, saturation currents
  and swept I-V fits against the true plasma.
docs_preset: quick
runtime: seconds
status: >-
  A synthetic diagnostic on a made-up background, not a model and not a verification. The probe
  does not perturb the plasma; its sheath is thin, collisionless and unmagnetized (so the electron
  saturation current is an upper bound), with no secondary emission or circuit effects. The fits
  use the model the currents come from, so the study shows only the error from the plasma changing
  during a sweep.
figures:
- >-
  A probe at fixed bias at three points over two periods: the plasma potential (solid) and
  floating potential (dashed), the electron temperature and density, and the ion (solid) and
  electron (dashed) saturation currents.
- >-
  Bias sweeps on the racetrack between the spokes, on a leading edge and inside a spoke (top to
  bottom), 0.1 (blue) and 10 (red) times the passage time of the edge: the probe current, with the
  true plasma potential (dashed).
- >-
  The same sweeps: the electron current on a log scale with the two fitted lines, the fitted
  plasma potential (dotted) and the true one (dashed).
- >-
  Fitted density, electron temperature and plasma potential on the racetrack against time for
  sweeps 0.1, 1 and 10 times the passage time, each sweep a step over its duration, against the
  background at the probe (black).
