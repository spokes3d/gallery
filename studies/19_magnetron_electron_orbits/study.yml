# Read by gallery-tools without running the script (see the Adding a study guide).
category: Basics
kind: verification
public: true
codes:
- mpiparticles
- plasmacoll
ladder: outside the ladder (basics)
questions: []
summary: >-
  Single electrons in the field of a planar magnetron, Boris-pushed: gyration, mirror bounce and
  the drift around the racetrack, against guiding-centre theory.
docs_preset: full
runtime: about a minute (full); seconds (smoke)
status: >-
  Verifies mpiparticles' Boris push against guiding-centre theory for magnetized electrons
  reflected above the sheath. The fields are assumed: the magnet field of a 2-inch magnetron
  without yoke and a prescribed sheath and presheath, not a solution of Poisson's equation. No
  collisions, and electrons that enter the sheath are not tested.
figures:
- >-
  Three electrons in the (r, z) plane over their first 120 ns, on the field line with its apex 4
  mm above the target (dashed): 5 eV at a large and at a 30 degree pitch angle, and 30 eV at 30
  degrees, which reaches the cathode sheath (grey) and is reflected.
- >-
  The guiding centres of the same electrons seen from above over their first turn around the axis
  (a dot marks the start), with the radii of the magnets (dotted).
- >-
  Azimuthal drift against the kinetic energy at a pitch angle of 75 degrees: the Boris push (dots)
  against the bounce-averaged guiding-centre drifts, E×B alone, with the grad-B drift and with the
  curvature drift.
- >-
  Bounce period (top) and azimuthal drift (bottom) against the pitch angle for 5 eV electrons: the
  Boris push (dots) against the guiding-centre period, the harmonic period of small bounces and
  the bounce-averaged drifts.
