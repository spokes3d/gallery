# Read by gallery-tools without running the script (see the Adding a study guide).
category: Basics
kind: example
public: true
codes: []
ladder: outside the ladder (basics)
questions: []
summary: >-
  The field of a 2-inch planar magnetron from the exact field of current loops: the arch, the
  racetrack, the magnetic mirror, and balanced against unbalanced magnets.
docs_preset: full
runtime: about 10 seconds
status: >-
  Textbook material, not a model of a particular magnetron or a comparison with measurements. The
  magnets are assumed and there is no iron yoke, which strengthens a real field, so the field
  values are indicative only. The field is exact for uniformly magnetized magnets, and the traced
  lines keep psi constant to round-off.
figures:
- >-
  Field lines (white) and |B| above the target of the balanced magnetron; the coloured bars mark
  the radii of the magnets, 8 mm below the target. The dashed line joins the apexes of the field
  lines (B_z = 0) and meets the target at the racetrack.
- >-
  Radial (top) and axial (bottom) field on the target surface for the two magnet sets; the grey
  lines mark the racetrack (B_z = 0).
- >-
  |B| along field lines of the balanced magnetron with apexes 1, 2, 4 and 6 mm above the
  racetrack, against the arc length from the apex, and the unbalanced line with its apex at 2 mm
  (dashed).
- >-
  Field lines (white) over log10 |B| up to 60 mm above the target, balanced (top) and unbalanced
  (bottom), with the separatrix psi = 0 (thick line) and the null on the axis (cross).
