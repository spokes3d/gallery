# Read by gallery-tools without running the script (see the Adding a study guide).
category: Linear theory
kind: verification
public: true
codes: [wellbalanced, plasmacoll]
ladder: outside the ladder (basics)
questions:
- Q1
summary: >-
  The local linear theory of the gradient-drift (Simon–Hoh) instability for DC magnetron
  conditions, verified against closed-form relations.
docs_preset: full
runtime: about 3 minutes
status: >-
  Verifies LocalDispersion in the Simon–Hoh limit and against Boeuf's relation; the agreement is
  looser near the inertia cutoff (ε ≈ 1). The rest is an example of the local theory: it needs k_y
  |L_n| ≫ 1 and uniform B and E, uses typical rather than measured parameters, and leaves out the
  nonlocal and nonlinear problem.
figures:
- >-
  Simon–Hoh limit at L_n = 5 mm: growth rate (top) and phase speed along E×B (bottom) of
  LocalDispersion, Boeuf's relation, the Simon–Hoh quadratic and γ ≈ k_y √(e E₀ L_n/M); only
  growing modes are drawn.
- >-
  Relative difference of LocalDispersion from the Simon–Hoh roots against the electron-inertia
  parameter ε, made small by raising B from 30 to 480 mT at k_y = 300 and 1000 /m; the dashed line
  is ε.
- >-
  Growth rate (top) and phase speed along E×B (bottom) against k_y with Poisson's equation, for
  density gradient lengths of 2, 5 and 10 mm, with the Simon–Hoh quadratic (thin dashed).
- >-
  The same for fields of 15, 30 and 60 mT at L_n = 5 mm.
- >-
  Growth rate at k_y = 300 /m against E·∇n/(|E| n), the inverse gradient length signed by the
  direction of the field: LocalDispersion with Poisson's equation and the Simon–Hoh quadratic.
- >-
  Growth rate (top) and phase speed (bottom) with electron collisions (ν_e = 10⁸ and 10⁹ /s) and
  with warm ions (T_i = 0.5 and 2 eV), against cold collisionless ions, at L_n = 5 mm.
