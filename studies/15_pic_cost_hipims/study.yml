status: >-
  An estimate, not a measurement. The rules give cell sizes and time steps within a factor of 1.6
  of those the two published 2D cases chose. The markers per cell and the cost of a marker step
  are assumptions; the field solve, load imbalance, implicit schemes and mesh refinement are not
  considered.
